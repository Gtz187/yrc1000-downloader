      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#1557B0"/>
    </linearGradient>
    <linearGradient id="arm" gradientUnits="userSpaceOnUse" x1="40" y1="220" x2="220" y2="60">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFE3FF"/>
    </linearGradient>
    <radialGradient id="glow" cx=".75" cy=".2" r=".7">
      <stop offset="0" stop-color="#4FC3F7" stop-opacity=".45"/>
      <stop offset="1" stop-color="#4FC3F7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect width="256" height="256" rx="56" fill="url(#glow)"/>

